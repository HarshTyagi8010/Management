name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for secret scanning
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # mongod binary for the replica-set integration and E2E suites (mongodb-memory-server).
      - uses: actions/cache@v4
        with:
          path: .cache/mongodb-binaries
          key: mongodb-8.0.34-${{ runner.os }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Playwright uses the runner's preinstalled Google Chrome (channel: chrome); no browser download.
      - name: E2E (Playwright, responsive + axe + keyboard + CSP)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Dependency audit (high/critical)
        run: npm audit --audit-level=high --omit=dev
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
